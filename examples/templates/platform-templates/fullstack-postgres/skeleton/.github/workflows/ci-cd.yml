name: CI-CD DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FRONTEND_IMAGE: noletengine/${{ values.component_id }}
  BACKEND_IMAGE: noletengine/${{ values.component_id }}-api
  IMAGE_TAG: latest

jobs:
  validate-repository:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository structure:"
          find . -maxdepth 4 -type f | sort

      - name: Check required files
        run: |
          test -f catalog-info.yaml
          test -f mkdocs.yml
          test -f README.md
          test -f Dockerfile
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f helm/Chart.yaml
          test -f helm/values.yaml
          test -f argocd/application.yaml

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: validate-repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import FastAPI app
        run: |
          cd backend
          python -c "from app.main import app; print(app.title)"

  secret-scan:
    name: Secret Scan with Gitleaks
    runs-on: ubuntu-latest
    needs: validate-repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  sast-scan:
    name: SAST Scan with Semgrep
    runs-on: ubuntu-latest
    needs: validate-repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        continue-on-error: true

  iac-scan:
    name: IaC Scan with Checkov
    runs-on: ubuntu-latest
    needs: validate-repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - secret-scan
      - sast-scan
      - iac-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" .

      - name: Build backend image
        run: |
          docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" backend

      - name: List built images
        run: |
          docker images | grep noletengine || true

  container-scan:
    name: Container Scan with Trivy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image for scanning
        run: |
          docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" .

      - name: Build backend image for scanning
        run: |
          docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: noletengine/${{ values.component_id }}:latest
          format: table
          exit-code: 0

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: noletengine/${{ values.component_id }}-api:latest
          format: table
          exit-code: 0

  helm-validate:
    name: Helm Validate
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm

      - name: Helm template render
        run: |
          helm template ${{ values.component_id }} helm --namespace dev
