apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.appName }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.appName }}
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: {{ .Values.global.appName }}
    backstage.io/owner: {{ .Values.global.owner | quote }}
data:
  APP_NAME: {{ .Values.global.appName | quote }}
  APP_ENV: {{ .Values.global.environment | quote }}
  API_PORT: {{ .Values.api.service.port | quote }}
  FRONTEND_PORT: {{ .Values.frontend.service.port | quote }}
  DB_HOST: {{ .Values.api.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.api.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.api.env.DB_NAME | quote }}
  DB_USER: {{ .Values.api.env.DB_USER | quote }}
