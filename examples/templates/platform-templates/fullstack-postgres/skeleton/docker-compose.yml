services:
  postgres:
    image: postgres:16
    container_name: ${{ values.component_id }}-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${{ values.component_id }}-api
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: changeme-dev-password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${{ values.component_id }}-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - app-net

volumes:
  postgres-data:

networks:
  app-net:
    driver: bridge
