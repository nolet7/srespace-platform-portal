apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-module-golden-path
  title: Terraform OpenTofu Module Golden Path
  description: Creates an IaC module with Terraform or OpenTofu, Checkov, tfsec, GitHub Actions, and documentation.
  tags:
    - platform-engineering
    - devops
    - devsecops
    - techdocs
spec:
  owner: group:default/platform-engineering
  type: library

  parameters:
    - title: Application Information
      required:
        - component_id
        - description
        - owner
      properties:
        component_id:
          title: Component Name
          type: string
          description: Lowercase name. Example payment-api.
          pattern: '^([a-z][a-z0-9]*)(-[a-z0-9]+)*$'
        description:
          title: Description
          type: string
          default: Creates an IaC module with Terraform or OpenTofu, Checkov, tfsec, GitHub Actions, and documentation.
        owner:
          title: Owner
          type: string
          default: group:default/platform-engineering

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Open Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
