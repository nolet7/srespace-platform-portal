apiVersion: apps/v1
kind: Deployment
metadata:
name: ${{ values.name }}
labels:
app: ${{ values.name }}
owner: ${{ values.owner }}
spec:
replicas: 2
selector:
matchLabels:
app: ${{ values.name }}
template:
metadata:
labels:
app: ${{ values.name }}
owner: ${{ values.owner }}
spec:
containers:
- name: ${{ values.name }}
image: ${{ values.dockerImage }}
ports:
- containerPort: ${{ values.servicePort }}
readinessProbe:
httpGet:
path: /ready
port: ${{ values.servicePort }}
initialDelaySeconds: 5
periodSeconds: 10
livenessProbe:
httpGet:
path: /health
port: ${{ values.servicePort }}
initialDelaySeconds: 10
periodSeconds: 20
resources:
requests:
cpu: 100m
memory: 128Mi
limits:
cpu: 500m
memory: 512Mi
