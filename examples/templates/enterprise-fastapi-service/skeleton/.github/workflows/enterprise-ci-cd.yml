name: enterprise-ci-cd

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: ${{ values.dockerImage }}

jobs:
  validate:
    name: Validate service, docs, Docker, and Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs-techdocs-core

      - name: Validate TechDocs
        run: |
          mkdocs build --strict --site-dir /tmp/techdocs-site

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME" .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ values.dockerImage }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint ./helm
          helm template ${{ values.name }} ./helm

  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: validate
{% raw %}
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
{% endraw %}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        env:
{% raw %}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
{% endraw %}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_REPO="${IMAGE_NAME%:*}"
          IMAGE_TAG="${GITHUB_SHA::7}"

          docker build -t "$IMAGE_NAME" -t "$IMAGE_REPO:$IMAGE_TAG" .

          docker push "$IMAGE_NAME"
          docker push "$IMAGE_REPO:$IMAGE_TAG"
